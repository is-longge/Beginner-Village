<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的自适应导航页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6fa5;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 15px; /* 移动端边距稍小一点 */
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* 搜索框适配 */
        .search-box { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .search-form { display: flex; flex-wrap: wrap; gap: 0; }
        .search-input { flex: 1; min-width: 150px; padding: 12px; border: 2px solid var(--primary-color); border-radius: 8px 0 0 8px; outline: none; }
        .search-btn { padding: 12px 20px; background: var(--primary-color); color: white; border: none; border-radius: 0 8px 8px 0; cursor: pointer; }

        /* 网格布局适配 */
        .categories { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        /* 移动端特殊处理：当屏幕宽度小于 600px 时 */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .search-form { flex-direction: row; } /* 保持搜索框和按钮在一行，或改为column */
            .categories { grid-template-columns: 1fr; } /* 卡片强制单列 */
            .link-item { padding: 15px; } /* 增加手机点击区域高度 */
        }

        .category { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .link-item { 
            display: flex; 
            align-items: center; 
            padding: 12px; 
            margin: 8px 0; 
            background: #f9f9f9; 
            border-radius: 8px; 
            text-decoration: none; 
            color: inherit; 
            font-size: 16px; /* 移动端标准字体大小 */
        }
        .link-icon { margin-right: 12px; width: 20px; text-align: center; color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1>我的导航页</h1>
            <button id="loginBtn" style="padding:5px 10px;">管理</button>
        </header>

        <div class="search-box">
            <form class="search-form">
                <input type="text" class="search-input" placeholder="输入搜索内容...">
                <button type="submit" class="search-btn">搜索</button>
            </form>
        </div>

        <div class="categories" id="navGrid">
            <div class="category">
                <h2 style="border-bottom:2px solid var(--primary-color); margin-bottom:10px; padding-bottom:5px;">常用网站</h2>
                <div class="links">
                    <a href="https://www.google.com" class="link-item"><i class="fab fa-google link-icon"></i>Google</a>
                    <a href="https://github.com" class="link-item"><i class="fab fa-github link-icon"></i>GitHub</a>
                </div>
            </div>
            </div>
    </div>
</body>
</html>
